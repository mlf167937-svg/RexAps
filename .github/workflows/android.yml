name: Build RexAps Release

on:
  push:
    branches:
      - develepment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostic logs
        id: init_logs
        run: |
          set -Eeuo pipefail
          : > Build.log
          : > NodeJS-Download.log
          : > Actions-AllLog.log
          {
            echo "RexAps Release pipeline"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Started (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
          } | tee -a Actions-AllLog.log

      - name: Setup JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK command-line tools
        id: android_tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'

      - name: Install required Android SDK packages
        id: android_sdk
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          mkdir -p "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          
          echo "Android SDK packages are ready."

      - name: Cache Gradle
        id: gradle_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare persistent Release signing key
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          SIGNING_DIR="$RUNNER_TEMP/rexaps-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/rexaps-release.jks"
          chmod 600 "$SIGNING_DIR/rexaps-release.jks"

          echo "RELEASE_STORE_FILE=$SIGNING_DIR/rexaps-release.jks" >> "$GITHUB_ENV"

      - name: Setup Node.js 26.13.0 for RexChat dependencies
        id: setup_nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'

      - name: Download and validate RexChat Android Native Runtime
        id: nodejs_download
        if: always() && steps.checkout.outcome == 'success'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/NodeJS-Download.log" "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          RUNTIME_URL="https://github.com/mlf167937-svg/RexAps/releases/download/v1.1/rexchat-node-android-v1.zip"
          DOWNLOAD_DIR="$RUNNER_TEMP/rexchat-runtime"
          ARCHIVE="$DOWNLOAD_DIR/rexchat-node-android-v1.zip"
          EXTRACT_DIR="$DOWNLOAD_DIR/extracted"
          JNI_ROOT="app/src/main/jniLibs"
          NODE_VERSION="26.13.0"
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          LLVM_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          READELF="$LLVM_BIN/llvm-readelf"
          NM="$LLVM_BIN/llvm-nm"
          test -x "$READELF"
          test -x "$NM"

          mkdir -p "$DOWNLOAD_DIR" "$EXTRACT_DIR"
          echo "Downloading RexChat Node.js ${NODE_VERSION} Android runtime..."
          curl -fL --retry 5 --retry-delay 3 "$RUNTIME_URL" -o "$ARCHIVE"
          test -s "$ARCHIVE"
          sha256sum "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          ARCHIVE_LIBS=(libnode.so libcares.so libsqlite3.so libc++_shared.so librexchat_node.so)
          APK_LIBS=(libnode.so libcares.so libsqlite3.so librexchat_node.so)
          for ABI in arm64-v8a armeabi-v7a; do
            SOURCE_DIR="$EXTRACT_DIR/$ABI"
            DEST_DIR="$JNI_ROOT/$ABI"
            mkdir -p "$DEST_DIR"
            for LIB in "${ARCHIVE_LIBS[@]}"; do
              if [[ ! -s "$SOURCE_DIR/$LIB" ]]; then
                echo "ERROR: Runtime archive is missing $ABI/$LIB"
                exit 1
              fi
            done
            # Use the matching runtime from the selected NDK for our JNI bridge.
            # AGP packages it automatically for ANDROID_STL=c++_shared.
            case "$ABI" in
              arm64-v8a) NDK_TRIPLE="aarch64-linux-android" ;;
              armeabi-v7a) NDK_TRIPLE="arm-linux-androideabi" ;;
            esac
            test -s "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$NDK_TRIPLE/libc++_shared.so"
            for LIB in "${APK_LIBS[@]}"; do
              cp "$SOURCE_DIR/$LIB" "$DEST_DIR/$LIB"
            done
          done

          # Reject wrong-architecture files and unresolved Linux-only dependencies.
          SYSTEM_LIBS='|libandroid.so|liblog.so|libdl.so|libc.so|libm.so|libz.so|libjnigraphics.so|libEGL.so|libGLESv2.so|libGLESv3.so|libOpenSLES.so|libvulkan.so|libmediandk.so|libaaudio.so|libcamera2ndk.so|libnativewindow.so|libsync.so|libneuralnetworks.so|'
          for ABI in arm64-v8a armeabi-v7a; do
            case "$ABI" in
              arm64-v8a) EXPECTED_MACHINE='AArch64'; EXPECTED_CLASS='ELF64' ;;
              armeabi-v7a) EXPECTED_MACHINE='ARM'; EXPECTED_CLASS='ELF32' ;;
            esac
            ABI_DIR="$JNI_ROOT/$ABI"
            echo "===== Validating $ABI ====="
            for LIB in "${ARCHIVE_LIBS[@]}"; do
              SO="$EXTRACT_DIR/$ABI/$LIB"
              HEADER="$("$READELF" -h "$SO")"
              grep -Eq "Class:.*$EXPECTED_CLASS" <<<"$HEADER"
              grep -Eq "Machine:.*$EXPECTED_MACHINE" <<<"$HEADER"
              echo "OK ELF: $ABI/$LIB ($(stat -c '%s' "$SO") bytes)"
              DYNAMIC="$($READELF -d "$SO")"
              if grep -Eq '\((RPATH|RUNPATH)\)' <<<"$DYNAMIC"; then
                echo "ERROR: $ABI/$LIB contains RPATH/RUNPATH; Android runtime must not depend on build-host paths."
                exit 1
              fi
              while IFS= read -r DEP; do
                [[ -n "$DEP" ]] || continue
                [[ -s "$ABI_DIR/$DEP" ]] && continue
                if [[ "$DEP" == "libc++_shared.so" ]]; then
                  continue # Supplied by NDK/Gradle for this ABI.
                fi
                case "$SYSTEM_LIBS" in
                  *"|$DEP|"*) ;;
                  *)
                    echo "ERROR: $ABI/$LIB needs $DEP, but it is not bundled and is not an Android system library."
                    exit 1
                    ;;
                esac
              done < <("$READELF" -d "$SO" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
            done
          done

          # The custom JNI bridge links node::Start(int, char**); fail early if
          # the supplied libnode does not export that embedding entry point.
          for ABI in arm64-v8a armeabi-v7a; do
            NODE_SO="$EXTRACT_DIR/$ABI/libnode.so"
            SYMBOLS="$("$NM" -D --defined-only --demangle "$NODE_SO")"
            if ! grep -Fq 'node::Start(int, char**)' <<<"$SYMBOLS"; then
              echo "ERROR: $ABI/libnode.so does not export node::Start(int, char**)."
              exit 1
            fi
            echo "OK Node embedding symbol: $ABI node::Start(int, char**)"
          done

          # Build a known JNI entry point against matching Node.js 26.13 headers.
          HEADERS_ARCHIVE="$RUNNER_TEMP/node-v${NODE_VERSION}-headers.tar.gz"
          HEADERS_DIR="$RUNNER_TEMP/node-v${NODE_VERSION}-headers"
          mkdir -p "$HEADERS_DIR"
          curl -fL --retry 5 --retry-delay 3 \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-headers.tar.gz" \
            -o "$HEADERS_ARCHIVE"
          tar -xzf "$HEADERS_ARCHIVE" -C "$HEADERS_DIR" --strip-components=1
          test -s "$HEADERS_DIR/include/node/node.h"
          mkdir -p app/libnode/include
          rm -rf app/libnode/include/node
          cp -a "$HEADERS_DIR/include/node" app/libnode/include/node
          echo "RexChat Android runtime and matching Node.js headers are ready."

      - name: Bundle RexChat Baileys dependencies
        id: rexchat_deps
        if: always() && steps.nodejs_download.outcome == 'success' && steps.setup_nodejs.outcome == 'success'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/NodeJS-Download.log" "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail
          REXCHAT_DIR="app/src/main/assets/rexchat"
          test -s "$REXCHAT_DIR/package.json"
          npm install \
            --prefix "$REXCHAT_DIR" \
            --omit=dev \
            --no-audit \
            --no-fund \
            --package-lock=false \
            --ignore-scripts
          test -s "$REXCHAT_DIR/node_modules/@whiskeysockets/baileys/package.json"
          test -s "$REXCHAT_DIR/node_modules/pino/package.json"
          rm -rf "$REXCHAT_DIR/node_modules/.bin"
          echo "RexChat Baileys and production dependencies bundled into Android assets."

      - name: Grant execute permission for Gradle wrapper
        id: gradle_wrapper
        if: always() && steps.checkout.outcome == 'success'
        run: chmod +x gradlew

      - name: Build Release APKs
        id: build
        if: >-
          steps.java.outcome == 'success' &&
          steps.android_sdk.outcome == 'success' &&
          steps.signing.outcome == 'success' &&
          steps.nodejs_download.outcome == 'success' &&
          steps.rexchat_deps.outcome == 'success'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Build.log" "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail
          ./gradlew clean :app:assembleRelease --stacktrace --refresh-dependencies

          OUTPUT_DIR="app/build/outputs/apk/release"
          ARM64_APK="$OUTPUT_DIR/app-arm64-v8a-release-unsigned.apk"
          ARM32_APK="$OUTPUT_DIR/app-armeabi-v7a-release-unsigned.apk"
          UNIVERSAL_APK="$OUTPUT_DIR/app-universal-release-unsigned.apk"
          REQUIRED_APK_LIBS=(libnode.so librexnode.so libcares.so libsqlite3.so libc++_shared.so librexchat_node.so)

          for APK in "$ARM64_APK" "$ARM32_APK" "$UNIVERSAL_APK"; do
            test -s "$APK"
            unzip -Z1 "$APK" | grep -q '^assets/rexchat/node_modules/@whiskeysockets/baileys/package.json$'
            for LIB in "${REQUIRED_APK_LIBS[@]}"; do
              unzip -Z1 "$APK" | grep -q "^lib/[^/]*/$LIB$"
            done
          done

          unzip -Z1 "$ARM64_APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$ARM64_APK" | grep -q '^lib/arm64-v8a/librexnode.so$'
          unzip -Z1 "$ARM32_APK" | grep -q '^lib/armeabi-v7a/libnode.so$'
          unzip -Z1 "$ARM32_APK" | grep -q '^lib/armeabi-v7a/librexnode.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/arm64-v8a/librexnode.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/armeabi-v7a/libnode.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/armeabi-v7a/librexnode.so$'
          echo "Verified: APK variants include embedded Node, dependencies, JNI bridge, and Baileys."

      - name: Sign APKs and create download ZIPs
        id: verify
        if: steps.build.outcome == 'success' && steps.signing.outcome == 'success'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          OUTPUT_DIR="app/build/outputs/apk/release"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          SIGN_DIR="$RUNNER_TEMP/rexaps-signed"

          mkdir -p "$DIST_DIR" "$SIGN_DIR"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          
          STORE_PASS_FILE="$RUNNER_TEMP/rexaps-store-pass"
          KEY_PASS_FILE="$RUNNER_TEMP/rexaps-key-pass"
          printf '%s' "$RELEASE_STORE_PASSWORD" > "$STORE_PASS_FILE"
          printf '%s' "$RELEASE_KEY_PASSWORD" > "$KEY_PASS_FILE"
          trap 'rm -f "$STORE_PASS_FILE" "$KEY_PASS_FILE"' EXIT

          sign_one() {
            local unsigned="$1"
            local signed="$2"
            local aligned="${unsigned%.apk}-aligned.apk"

            if [[ ! -s "$unsigned" ]]; then
              echo "ERROR: Expected APK missing: $unsigned"
              return 1
            fi

            "$ZIPALIGN" -p -f 4 "$unsigned" "$aligned"

            "$APKSIGNER" sign \
              --ks "$RELEASE_STORE_FILE" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass "file:$STORE_PASS_FILE" \
              --key-pass "file:$KEY_PASS_FILE" \
              --out "$signed" \
              "$aligned"
          }

          ARM64_APK="$SIGN_DIR/RexAps-Arm64-v8a.apk"
          ARM32_APK="$SIGN_DIR/RexAps-Armeabi-v7a.apk"
          UNIVERSAL_APK="$SIGN_DIR/RexAps-Universal.apk"

          # Ubah nama target unsigned di bawah jika nama output dari gradle berbeda
          sign_one "$OUTPUT_DIR/app-arm64-v8a-release-unsigned.apk" "$ARM64_APK"
          sign_one "$OUTPUT_DIR/app-armeabi-v7a-release-unsigned.apk" "$ARM32_APK"
          sign_one "$OUTPUT_DIR/app-universal-release-unsigned.apk" "$UNIVERSAL_APK"

          create_bundle() {
            local bundle_name="$1"
            local apk_path="$2"
            local bundle_dir="$RUNNER_TEMP/$bundle_name"
            
            mkdir -p "$bundle_dir"

            # Mengubah nama APK menjadi RexAps.apk di dalam folder ZIP
            cp "$apk_path" "$bundle_dir/RexAps.apk"
            (
              cd "$bundle_dir"
              zip -q -r "$DIST_DIR/$bundle_name.zip" .
            )
          }

          create_bundle RexAps-Arm64-v8a "$ARM64_APK"
          create_bundle RexAps-Armeabi-v7a "$ARM32_APK"
          create_bundle RexAps-Universal "$UNIVERSAL_APK"

      - name: Create Actions.zip diagnostics
        id: diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p dist

          for FILE in Build.log NodeJS-Download.log Actions-AllLog.log; do
            [[ -f "$FILE" ]] || : > "$FILE"
          done

          zip -q -j dist/Actions.zip Build.log NodeJS-Download.log Actions-AllLog.log

          # Keep R8's mapping with private CI diagnostics so obfuscated Release
          # exceptions can be retraced without publishing the mapping beside APKs.
          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"
          if [[ -s "$MAPPING_FILE" ]]; then
            cp "$MAPPING_FILE" dist/RexAps-release-mapping.txt
            zip -q -j dist/Actions.zip dist/RexAps-release-mapping.txt
          fi

      - name: Upload RexAps-Arm64-v8a
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: RexAps-Arm64-v8a
          path: dist/RexAps-Arm64-v8a.zip
          retention-days: 14

      - name: Upload RexAps-Armeabi-v7a
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: RexAps-Armeabi-v7a
          path: dist/RexAps-Armeabi-v7a.zip
          retention-days: 14

      - name: Upload RexAps-Universal
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: RexAps-Universal
          path: dist/RexAps-Universal.zip
          retention-days: 14

      - name: Upload Actions Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Actions
          path: dist/Actions.zip
          retention-days: 14
