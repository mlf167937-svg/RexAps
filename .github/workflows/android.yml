name: Build RexAps Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostic logs
        id: init_logs
        run: |
          set -Eeuo pipefail
          : > Build.log
          : > NodeJS-Download.log
          : > Actions-AllLog.log
          {
            echo "RexAps Release pipeline"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Started (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
          } | tee -a Actions-AllLog.log

      - name: Setup JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK command-line tools
        id: android_tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'

      - name: Install required Android SDK packages
        id: android_sdk
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          mkdir -p "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          
          echo "Android SDK packages are ready."

      - name: Cache Gradle
        id: gradle_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare persistent Release signing key
        id: signing
        continue-on-error: true
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          SIGNING_DIR="$RUNNER_TEMP/rexaps-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/rexaps-release.jks"
          chmod 600 "$SIGNING_DIR/rexaps-release.jks"

          echo "RELEASE_STORE_FILE=$SIGNING_DIR/rexaps-release.jks" >> "$GITHUB_ENV"

      - name: Setup Node.js 26.13.0 for RexChat dependencies
        id: setup_nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'

      - name: Download and validate Node.js Mobile ARM libraries
        id: nodejs_download
        if: always() && steps.checkout.outcome == 'success'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/NodeJS-Download.log" "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          ARM64_URL="https://github.com/mlf167937-svg/RexAps/releases/download/v26.13/libnode.so"
          ARM32_URL="https://github.com/mlf167937-svg/RexAps/releases/download/v26.12/libnode.so"
          NODE_VERSION="26.13.0"

          ARM64_DIR="app/src/main/jniLibs/arm64-v8a"
          ARM32_DIR="app/src/main/jniLibs/armeabi-v7a"
          mkdir -p "$ARM64_DIR" "$ARM32_DIR"

          echo "Downloading Node.js 26.13 ARM64 libnode.so from v26.13..."
          curl -fL --retry 5 --retry-delay 3 "$ARM64_URL" -o "$ARM64_DIR/libnode.so"

          echo "Downloading Node.js 26.13 ARM32 libnode.so from v26.12..."
          curl -fL --retry 5 --retry-delay 3 "$ARM32_URL" -o "$ARM32_DIR/libnode.so"

          test -s "$ARM64_DIR/libnode.so"
          test -s "$ARM32_DIR/libnode.so"

          echo "ARM64 library:"
          ls -lh "$ARM64_DIR/libnode.so"
          file "$ARM64_DIR/libnode.so"

          echo "ARM32 library:"
          ls -lh "$ARM32_DIR/libnode.so"
          file "$ARM32_DIR/libnode.so"

          # Android exposes zlib as libz.so. These libnode builds may carry
          # the Linux-style SONAME dependency libz.so.1, which Android's
          # linker cannot resolve. Rewrite only that DT_NEEDED entry so it
          # resolves to Android's public system zlib.
          sudo apt-get update
          sudo apt-get install --yes patchelf

          ARM64_MACHINE="$(readelf -h "$ARM64_DIR/libnode.so" | awk -F: '/Machine:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')"
          ARM32_MACHINE="$(readelf -h "$ARM32_DIR/libnode.so" | awk -F: '/Machine:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')"
          [[ "$ARM64_MACHINE" == "AArch64" ]] || { echo "ERROR: ARM64 URL returned ELF machine '$ARM64_MACHINE'" >&2; exit 1; }
          [[ "$ARM32_MACHINE" == "ARM" ]] || { echo "ERROR: ARM32 URL returned ELF machine '$ARM32_MACHINE'" >&2; exit 1; }

          for LIB in "$ARM64_DIR/libnode.so" "$ARM32_DIR/libnode.so"; do
            echo "Inspecting ELF dependencies: $LIB"
            readelf -h "$LIB" | grep -E 'Class:|Machine:'
            readelf -d "$LIB" | grep NEEDED || true

            if readelf -d "$LIB" | grep -Fq 'Shared library: [libz.so.1]'; then
              echo "Replacing Linux zlib SONAME dependency with Android libz.so"
              patchelf --replace-needed libz.so.1 libz.so "$LIB"
            fi

            if readelf -d "$LIB" | grep -Fq 'Shared library: [libz.so.1]'; then
              echo "ERROR: unresolved libz.so.1 dependency remains in $LIB" >&2
              exit 1
            fi

            # These are glibc/Linux runtime dependencies, not Android/Bionic
            # system libraries. Do not publish an APK containing such a binary.
            if readelf -d "$LIB" | grep -Eiq \
              'Shared library: \[(libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|ld-linux[^]]*|libstdc\+\+\.so\.6)\]'; then
              echo "ERROR: $LIB still depends on a GNU/Linux runtime library" >&2
              readelf -d "$LIB" | grep NEEDED >&2 || true
              exit 1
            fi

            echo "Validated Android-compatible dependency names for $LIB"
          done

          echo "Final ARM64 dependencies:"
          readelf -d "$ARM64_DIR/libnode.so" | grep NEEDED || true
          echo "Final ARM32 dependencies:"
          readelf -d "$ARM32_DIR/libnode.so" | grep NEEDED || true

          # The JNI bridge calls node::Start(), so it must compile against the
          # matching Node.js C++ headers, not just package libnode.so.
          HEADERS_ARCHIVE="$RUNNER_TEMP/node-v${NODE_VERSION}-headers.tar.gz"
          HEADERS_DIR="$RUNNER_TEMP/node-v${NODE_VERSION}-headers"
          mkdir -p "$HEADERS_DIR"
          curl -fL --retry 5 --retry-delay 3 \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-headers.tar.gz" \
            -o "$HEADERS_ARCHIVE"
          tar -xzf "$HEADERS_ARCHIVE" -C "$HEADERS_DIR" --strip-components=1
          test -s "$HEADERS_DIR/include/node/node.h"
          mkdir -p app/libnode/include
          rm -rf app/libnode/include/node
          cp -a "$HEADERS_DIR/include/node" app/libnode/include/node

          echo "Node.js ${NODE_VERSION} headers and both Android ARM libraries are ready."

      - name: Build and package Android c-ares runtime dependency
        id: cares_runtime
        if: always() && steps.nodejs_download.outcome == 'success'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/NodeJS-Download.log" "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          CARES_VERSION="1.34.9"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          NDK="$SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"
          CARES_ARCHIVE="$RUNNER_TEMP/c-ares-${CARES_VERSION}.tar.gz"
          CARES_SOURCE="$RUNNER_TEMP/c-ares-${CARES_VERSION}"

          test -f "$TOOLCHAIN"
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/c-ares/c-ares/releases/download/v${CARES_VERSION}/c-ares-${CARES_VERSION}.tar.gz" \
            -o "$CARES_ARCHIVE"
          mkdir -p "$CARES_SOURCE"
          tar -xzf "$CARES_ARCHIVE" -C "$CARES_SOURCE" --strip-components=1
          test -s "$CARES_SOURCE/CMakeLists.txt"

          for ABI in arm64-v8a armeabi-v7a; do
            case "$ABI" in
              arm64-v8a) EXPECTED_MACHINE="AArch64" ;;
              armeabi-v7a) EXPECTED_MACHINE="ARM" ;;
            esac

            ABI_DIR="app/src/main/jniLibs/$ABI"
            BUILD_DIR="$RUNNER_TEMP/cares-build-$ABI"
            mkdir -p "$ABI_DIR"
            rm -rf "$BUILD_DIR"

            echo "Building c-ares ${CARES_VERSION} for ${ABI}..."
            cmake -S "$CARES_SOURCE" -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-27 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCARES_SHARED=ON \
              -DCARES_STATIC=OFF \
              -DCARES_INSTALL=OFF \
              -DCARES_BUILD_TESTS=OFF \
              -DCARES_BUILD_CONTAINER_TESTS=OFF \
              -DCARES_BUILD_TOOLS=OFF \
              -DCARES_THREADS=ON
            cmake --build "$BUILD_DIR" --config Release --parallel 2

            CARES_BINARY="$(find "$BUILD_DIR" -type f \
              \( -name 'libcares.so' -o -name 'libcares.so.*' \) -print -quit)"
            test -n "$CARES_BINARY" && test -s "$CARES_BINARY"

            # libnode.so requests the exact DT_NEEDED name libcares.so.
            # Package a real Android/Bionic c-ares binary under that name.
            patchelf --set-soname libcares.so "$CARES_BINARY"
            install -m 755 "$CARES_BINARY" "$ABI_DIR/libcares.so"

            ACTUAL_MACHINE="$(readelf -h "$ABI_DIR/libcares.so" | awk -F: '/Machine:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')"
            [[ "$ACTUAL_MACHINE" == "$EXPECTED_MACHINE" ]] || {
              echo "ERROR: c-ares for $ABI has ELF machine '$ACTUAL_MACHINE'" >&2
              exit 1
            }

            readelf -h "$ABI_DIR/libcares.so" | grep -E 'Class:|Machine:'
            readelf -d "$ABI_DIR/libcares.so" | grep -E 'SONAME|NEEDED' || true
            echo "Packaged $ABI_DIR/libcares.so"
          done

          # Validate every non-system DT_NEEDED entry on both native libraries.
          # This prevents publishing an APK that simply fails later with the
          # next missing .so dependency.
          for ABI in arm64-v8a armeabi-v7a; do
            ABI_DIR="app/src/main/jniLibs/$ABI"
            if ! readelf -d "$ABI_DIR/libnode.so" | grep -Fq 'Shared library: [libcares.so]'; then
              echo "ERROR: $ABI_DIR/libnode.so does not declare the expected libcares.so dependency." >&2
              readelf -d "$ABI_DIR/libnode.so" | grep NEEDED >&2 || true
              exit 1
            fi

            for LIB in "$ABI_DIR/libnode.so" "$ABI_DIR/libcares.so"; do
              test -s "$LIB"
              while IFS= read -r NEEDED; do
                case "$NEEDED" in
                  libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|\
                  libEGL.so|libGLESv1_CM.so|libGLESv2.so|libOpenSLES.so|\
                  libvulkan.so|libjnigraphics.so|libmediandk.so|libnativewindow.so|\
                  libcamera2ndk.so|libaaudio.so|libatomic.so|libc++_shared.so|\
                  libunwind.so|libsync.so)
                    ;;
                  *)
                    if [[ ! -s "$ABI_DIR/$NEEDED" ]]; then
                      echo "ERROR: $LIB needs '$NEEDED', but it is neither an allowed Android system library nor packaged for $ABI." >&2
                      readelf -d "$LIB" | grep NEEDED >&2 || true
                      exit 1
                    fi
                    ;;
                esac
              done < <(readelf -d "$LIB" | sed -n 's/.*Shared library: \[(.*)\].*/\1/p')
            done
          done

          echo "Android c-ares dependency built, packaged, and validated for ARM64 and ARM32."

      - name: Bundle RexChat Baileys dependencies
        id: rexchat_deps
        if: always() && steps.nodejs_download.outcome == 'success' && steps.setup_nodejs.outcome == 'success'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/NodeJS-Download.log" "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          REXCHAT_DIR="app/src/main/assets/rexchat"
          test -s "$REXCHAT_DIR/package.json"
          npm install \
            --prefix "$REXCHAT_DIR" \
            --omit=dev \
            --no-audit \
            --no-fund \
            --package-lock=false \
            --ignore-scripts

          test -s "$REXCHAT_DIR/node_modules/@whiskeysockets/baileys/package.json"
          test -s "$REXCHAT_DIR/node_modules/pino/package.json"
          # Android assets do not need npm's command symlinks.
          rm -rf "$REXCHAT_DIR/node_modules/.bin"
          echo "RexChat Baileys and production dependencies bundled into Android assets."

      - name: Grant execute permission for Gradle wrapper
        id: gradle_wrapper
        if: always() && steps.checkout.outcome == 'success'
        run: chmod +x gradlew

      - name: Build Release APKs
        id: build
        if: >-
          steps.java.outcome == 'success' &&
          steps.android_sdk.outcome == 'success' &&
          steps.signing.outcome == 'success' &&
          steps.nodejs_download.outcome == 'success' &&
          steps.cares_runtime.outcome == 'success' &&
          steps.rexchat_deps.outcome == 'success'
        continue-on-error: true
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Build.log" "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail
          ./gradlew clean :app:assembleRelease --stacktrace --refresh-dependencies

          OUTPUT_DIR="app/build/outputs/apk/release"
          ARM64_APK="$OUTPUT_DIR/app-arm64-v8a-release-unsigned.apk"
          ARM32_APK="$OUTPUT_DIR/app-armeabi-v7a-release-unsigned.apk"
          UNIVERSAL_APK="$OUTPUT_DIR/app-universal-release-unsigned.apk"

          for APK in "$ARM64_APK" "$ARM32_APK" "$UNIVERSAL_APK"; do
            test -s "$APK"
            unzip -Z1 "$APK" | grep -q '^assets/rexchat/node_modules/@whiskeysockets/baileys/package.json$'
            unzip -Z1 "$APK" | grep -q '^lib/[^/]*/librexnode.so$'
            unzip -Z1 "$APK" | grep -q '^lib/[^/]*/libnode.so$'
            unzip -Z1 "$APK" | grep -q '^lib/[^/]*/libcares.so$'
          done

          unzip -Z1 "$ARM64_APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$ARM64_APK" | grep -q '^lib/arm64-v8a/libcares.so$'
          unzip -Z1 "$ARM64_APK" | grep -q '^lib/arm64-v8a/librexnode.so$'
          unzip -Z1 "$ARM32_APK" | grep -q '^lib/armeabi-v7a/libnode.so$'
          unzip -Z1 "$ARM32_APK" | grep -q '^lib/armeabi-v7a/libcares.so$'
          unzip -Z1 "$ARM32_APK" | grep -q '^lib/armeabi-v7a/librexnode.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/arm64-v8a/libcares.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/arm64-v8a/librexnode.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/armeabi-v7a/libnode.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/armeabi-v7a/libcares.so$'
          unzip -Z1 "$UNIVERSAL_APK" | grep -q '^lib/armeabi-v7a/librexnode.so$'
          echo "Verified: all APK variants include libnode.so, libcares.so, JNI bridge, and Baileys dependencies."

      - name: Sign APKs and create download ZIPs
        id: verify
        if: steps.build.outcome == 'success' && steps.signing.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Actions-AllLog.log") 2>&1
          set -Eeuo pipefail

          OUTPUT_DIR="app/build/outputs/apk/release"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          SIGN_DIR="$RUNNER_TEMP/rexaps-signed"

          mkdir -p "$DIST_DIR" "$SIGN_DIR"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          
          STORE_PASS_FILE="$RUNNER_TEMP/rexaps-store-pass"
          KEY_PASS_FILE="$RUNNER_TEMP/rexaps-key-pass"
          printf '%s' "$RELEASE_STORE_PASSWORD" > "$STORE_PASS_FILE"
          printf '%s' "$RELEASE_KEY_PASSWORD" > "$KEY_PASS_FILE"
          trap 'rm -f "$STORE_PASS_FILE" "$KEY_PASS_FILE"' EXIT

          sign_one() {
            local unsigned="$1"
            local signed="$2"
            local aligned="${unsigned%.apk}-aligned.apk"

            if [[ ! -s "$unsigned" ]]; then
              echo "ERROR: Expected APK missing: $unsigned"
              return 1
            fi

            "$ZIPALIGN" -p -f 4 "$unsigned" "$aligned"

            "$APKSIGNER" sign \
              --ks "$RELEASE_STORE_FILE" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass "file:$STORE_PASS_FILE" \
              --key-pass "file:$KEY_PASS_FILE" \
              --out "$signed" \
              "$aligned"
          }

          ARM64_APK="$SIGN_DIR/RexAps-Arm64-v8a.apk"
          ARM32_APK="$SIGN_DIR/RexAps-Armeabi-v7a.apk"
          UNIVERSAL_APK="$SIGN_DIR/RexAps-Universal.apk"

          # Ubah nama target unsigned di bawah jika nama output dari gradle berbeda
          sign_one "$OUTPUT_DIR/app-arm64-v8a-release-unsigned.apk" "$ARM64_APK"
          sign_one "$OUTPUT_DIR/app-armeabi-v7a-release-unsigned.apk" "$ARM32_APK"
          sign_one "$OUTPUT_DIR/app-universal-release-unsigned.apk" "$UNIVERSAL_APK"

          create_bundle() {
            local bundle_name="$1"
            local apk_path="$2"
            local bundle_dir="$RUNNER_TEMP/$bundle_name"
            
            mkdir -p "$bundle_dir"

            # Mengubah nama APK menjadi RexAps.apk di dalam folder ZIP
            cp "$apk_path" "$bundle_dir/RexAps.apk"
            (
              cd "$bundle_dir"
              zip -q -r "$DIST_DIR/$bundle_name.zip" .
            )
          }

          create_bundle RexAps-Arm64-v8a "$ARM64_APK"
          create_bundle RexAps-Armeabi-v7a "$ARM32_APK"
          create_bundle RexAps-Universal "$UNIVERSAL_APK"

      - name: Create Actions.zip diagnostics
        id: diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p dist

          for FILE in Build.log NodeJS-Download.log Actions-AllLog.log; do
            [[ -f "$FILE" ]] || : > "$FILE"
          done

          zip -q -j dist/Actions.zip Build.log NodeJS-Download.log Actions-AllLog.log

          # Keep R8's mapping with private CI diagnostics so obfuscated Release
          # exceptions can be retraced without publishing the mapping beside APKs.
          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"
          if [[ -s "$MAPPING_FILE" ]]; then
            cp "$MAPPING_FILE" dist/RexAps-release-mapping.txt
            zip -q -j dist/Actions.zip dist/RexAps-release-mapping.txt
          fi

      - name: Upload RexAps-Arm64-v8a
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: RexAps-Arm64-v8a
          path: dist/RexAps-Arm64-v8a.zip
          retention-days: 14

      - name: Upload RexAps-Armeabi-v7a
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: RexAps-Armeabi-v7a
          path: dist/RexAps-Armeabi-v7a.zip
          retention-days: 14

      - name: Upload RexAps-Universal
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: RexAps-Universal
          path: dist/RexAps-Universal.zip
          retention-days: 14

      - name: Upload Actions Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Actions
          path: dist/Actions.zip
          retention-days: 14
