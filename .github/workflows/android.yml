name: Build RexAps Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostic logs
        run: |
          set -Eeuo pipefail
          : > Build.log
          : > NodeJS-Download.log
          : > Full-Actions.log
          {
            echo "RexAps Release pipeline"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Started (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
          } | tee -a Full-Actions.log

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK command-line tools
        id: android_tools
        uses: android-actions/setup-android@v4
        with:
          # Command-line tools only; install the exact project SDK packages below.
          packages: ''
          accept-android-sdk-licenses: 'true'

      - name: Install required Android SDK packages
        id: android_sdk
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "Android SDK root: $SDK_ROOT"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          echo "Installed SDK packages:"
          sdkmanager --list_installed

          test -d "$SDK_ROOT/platforms/android-35"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -d "$SDK_ROOT/cmake/3.22.1"
          test -d "$SDK_ROOT/ndk/27.2.12479018"
          echo "Android SDK platform, build-tools, CMake, and NDK are ready."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare persistent Release signing key
        id: signing
        continue-on-error: true
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Configure all four release-signing secrets before building installable Release APKs."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/rexaps-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/rexaps-release.jks"
          test -s "$SIGNING_DIR/rexaps-release.jks"
          chmod 600 "$SIGNING_DIR/rexaps-release.jks"
          keytool -list -keystore "$SIGNING_DIR/rexaps-release.jks" \
            -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "RELEASE_STORE_FILE=$SIGNING_DIR/rexaps-release.jks" >> "$GITHUB_ENV"
          echo "Persistent Release keystore decoded and alias verified."

      - name: Download and validate Node.js Mobile ARM libraries
        id: nodejs_download
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/NodeJS-Download.log" "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail

          RELEASE_REPO="nodejs-mobile/nodejs-mobile"
          RELEASE_TAG="v18.20.4"
          ASSET_NAME="nodejs-mobile-v18.20.4-android.zip"
          DOWNLOAD_DIR="$RUNNER_TEMP/nodejs-mobile"
          ZIP_FILE="$DOWNLOAD_DIR/$ASSET_NAME"
          mkdir -p "$DOWNLOAD_DIR"

          echo "Inspecting ${RELEASE_REPO} ${RELEASE_TAG} assets..."
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets \
            --jq '.assets[] | "\(.name) | \(.size) bytes"'
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" \
            --pattern "$ASSET_NAME" --dir "$DOWNLOAD_DIR"
          test -s "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"

          mapfile -t ARCHIVE_ENTRIES < <(unzip -Z1 "$ZIP_FILE")
          for ABI in arm64-v8a armeabi-v7a; do
            ENTRY="$(printf '%s\n' "${ARCHIVE_ENTRIES[@]}" | awk -v abi="$ABI" \
              'tolower($0) ~ ("(^|/)bin/" tolower(abi) "/libnode\\.so$") && !seen { print; seen=1 }')"
            if [[ -z "$ENTRY" ]]; then
              echo "ERROR: ${ABI}/libnode.so was not found in ${ASSET_NAME}."
              printf '%s\n' "${ARCHIVE_ENTRIES[@]}" | grep -Ei 'libnode\.so$' || true
              exit 1
            fi

            LIB_DIR="app/src/main/jniLibs/$ABI"
            mkdir -p "$LIB_DIR"
            unzip -p "$ZIP_FILE" "$ENTRY" > "$LIB_DIR/libnode.so"
            test -s "$LIB_DIR/libnode.so"

            ELF_CLASS="$(readelf -h "$LIB_DIR/libnode.so" | awk -F: '/Class:/ {gsub(/^[ \t]+/, "", $2); print $2}')"
            ELF_MACHINE="$(readelf -h "$LIB_DIR/libnode.so" | awk -F: '/Machine:/ {gsub(/^[ \t]+/, "", $2); print $2}')"
            echo "${ABI}: ELF class=${ELF_CLASS}; machine=${ELF_MACHINE}"
            if [[ "$ABI" == "arm64-v8a" ]]; then
              [[ "$ELF_CLASS" == "ELF64" && "$ELF_MACHINE" == *AArch64* ]]
            else
              [[ "$ELF_CLASS" == "ELF32" && "$ELF_MACHINE" == *ARM* ]]
            fi
            sha256sum "$LIB_DIR/libnode.so"
          done

      - name: Grant execute permission for Gradle wrapper
        if: always()
        run: chmod +x gradlew

      - name: Build signed ARM Release APKs
        id: build
        if: steps.signing.outcome == 'success' && steps.nodejs_download.outcome == 'success'
        continue-on-error: true
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Build.log" "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail
          ./gradlew clean :app:assembleRelease --stacktrace --refresh-dependencies

      - name: Verify signatures, ABIs, and create download ZIPs
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail

          OUTPUT_DIR="app/build/outputs/apk/release"
          ARM64_APK="$OUTPUT_DIR/app-arm64-v8a-release.apk"
          ARM32_APK="$OUTPUT_DIR/app-armeabi-v7a-release.apk"
          UNIVERSAL_APK="$OUTPUT_DIR/app-universal-release.apk"
          for APK in "$ARM64_APK" "$ARM32_APK" "$UNIVERSAL_APK"; do
            if [[ ! -s "$APK" ]]; then
              echo "ERROR: Expected Release APK not found: $APK"
              find "$OUTPUT_DIR" -maxdepth 2 -type f -printf '%p (%s bytes)\n' || true
              exit 1
            fi
          done

          APKSIGNER="$(command -v apksigner || true)"
          if [[ -z "$APKSIGNER" ]]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "ERROR: Android build-tools apksigner was not found."
            exit 1
          fi

          mkdir -p dist staging
          create_bundle() {
            local bundle_name="$1"
            local apk_path="$2"
            local expected_csv="$3"
            local bundle_dir="staging/$bundle_name"
            local -a expected_abis actual_abis
            IFS=',' read -r -a expected_abis <<< "$expected_csv"
            mkdir -p "$bundle_dir"

            "$APKSIGNER" verify --verbose --print-certs "$apk_path"
            mapfile -t actual_abis < <(unzip -Z1 "$apk_path" | \
              awk -F/ '$1 == "lib" && NF >= 3 && $NF ~ /\.so$/ { print $2 }' | sort -u)
            if [[ "${actual_abis[*]}" != "${expected_abis[*]}" ]]; then
              echo "ERROR: ${bundle_name} ABI mismatch. Expected: ${expected_abis[*]}; got: ${actual_abis[*]:-none}"
              exit 1
            fi

            for ABI in "${expected_abis[@]}"; do
              for NATIVE_LIB in libnode.so libmozglue.so libxul.so; do
                if ! unzip -Z1 "$apk_path" | grep -Fxq "lib/$ABI/$NATIVE_LIB"; then
                  echo "ERROR: ${bundle_name} is missing lib/$ABI/$NATIVE_LIB"
                  echo "The ABI split may be missing Node.js Mobile or GeckoView native binaries."
                  exit 1
                fi
              done
            done

            cp "$apk_path" "$bundle_dir/$bundle_name.apk"
            printf 'RexAps Release package: %s\n\nThis APK was built as a signed Release APK by GitHub Actions.\nIncluded Android ABIs: %s\n\nExtract this APK from the ZIP before installing it. Keep the same release signing key for future app updates. If Android reports a signature conflict, do not uninstall immediately; first confirm which signing key was used.\n' \
              "$bundle_name" "$expected_csv" > "$bundle_dir/INSTALL.txt"
            (cd "$bundle_dir" && sha256sum "$bundle_name.apk" > SHA256SUMS.txt)
            (cd "$bundle_dir" && zip -q -r "$GITHUB_WORKSPACE/dist/$bundle_name.zip" .)
            unzip -tq "$GITHUB_WORKSPACE/dist/$bundle_name.zip"
            echo "Created dist/$bundle_name.zip"
            ls -lh "$GITHUB_WORKSPACE/dist/$bundle_name.zip" "$apk_path"
          }

          create_bundle "RexAps-arm64-v8a" "$ARM64_APK" "arm64-v8a"
          create_bundle "RexAps-armeabi-v7a" "$ARM32_APK" "armeabi-v7a"
          create_bundle "RexAps-Universal" "$UNIVERSAL_APK" "arm64-v8a,armeabi-v7a"

      - name: Create Actions.zip diagnostics
        id: diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          for FILE in Build.log NodeJS-Download.log Full-Actions.log; do
            [[ -f "$FILE" ]] || : > "$FILE"
          done
          {
            echo
            echo "Pipeline outcomes:"
            echo "  signing: ${{ steps.signing.outcome }}"
            echo "  NodeJS download: ${{ steps.nodejs_download.outcome }}"
            echo "  build: ${{ steps.build.outcome }}"
            echo "  verification/package: ${{ steps.verify.outcome }}"
            echo "Finished (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> Full-Actions.log
          zip -q -j dist/Actions.zip Build.log NodeJS-Download.log Full-Actions.log
          unzip -tq dist/Actions.zip
          echo "Created dist/Actions.zip"

      - name: Upload Release ZIPs and Actions.zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RexAps-Release-Files
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if a required stage failed
        if: always()
        run: |
          if [[ "${{ steps.android_tools.outcome }}" != "success" || "${{ steps.android_sdk.outcome }}" != "success" ]]; then
            echo "Android SDK setup failed. Check the Setup Android SDK and Install required Android SDK packages steps."
            exit 1
          fi
          if [[ "${{ steps.signing.outcome }}" != "success" ]]; then
            echo "Release signing setup failed. Configure all four RELEASE_* secrets."
            exit 1
          fi
          if [[ "${{ steps.nodejs_download.outcome }}" != "success" ]]; then
            echo "Node.js Mobile ARM32/ARM64 download or ELF validation failed. See Actions.zip."
            exit 1
          fi
          if [[ "${{ steps.build.outcome }}" != "success" ]]; then
            echo "Gradle Release build failed. See Build.log inside Actions.zip."
            exit 1
          fi
          if [[ "${{ steps.verify.outcome }}" != "success" ]]; then
            echo "APK signature / ABI verification or ZIP packaging failed. See Full-Actions.log."
            exit 1
          fi
          echo "All three signed Release bundles were built and verified."
