name: Build RexAps Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostic logs
        id: init_logs
        run: |
          set -Eeuo pipefail
          : > Build.log
          : > NodeJS-Download.log
          : > Full-Actions.log
          {
            echo "RexAps Release pipeline"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Started (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
          } | tee -a Full-Actions.log

      - name: Setup JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK command-line tools
        id: android_tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'

      - name: Install required Android SDK packages
        id: android_sdk
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          mkdir -p "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "Android SDK root: $SDK_ROOT"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          test -d "$SDK_ROOT/platforms/android-35"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          
          echo "Android SDK packages are ready."

      - name: Cache Gradle
        id: gradle_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare persistent Release signing key
        id: signing
        continue-on-error: true
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail

          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Release signing secrets are incomplete."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/rexaps-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/rexaps-release.jks"
          chmod 600 "$SIGNING_DIR/rexaps-release.jks"

          echo "RELEASE_STORE_FILE=$SIGNING_DIR/rexaps-release.jks" >> "$GITHUB_ENV"
          echo "Persistent Release keystore decoded and alias verified."

      - name: Download and validate Node.js Mobile ARM libraries
        id: nodejs_download
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/NodeJS-Download.log" "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail

          RELEASE_REPO="nodejs-mobile/nodejs-mobile"
          RELEASE_TAG="v18.20.4"
          ASSET_NAME="nodejs-mobile-v18.20.4-android.zip"

          DOWNLOAD_DIR="$RUNNER_TEMP/nodejs-mobile"
          ZIP_FILE="$DOWNLOAD_DIR/$ASSET_NAME"
          mkdir -p "$DOWNLOAD_DIR"

          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern "$ASSET_NAME" --dir "$DOWNLOAD_DIR"
          unzip -tq "$ZIP_FILE"

          mapfile -t ARCHIVE_ENTRIES < <(unzip -Z1 "$ZIP_FILE")

          for ABI in arm64-v8a armeabi-v7a; do
            ENTRY="$(printf '%s\n' "${ARCHIVE_ENTRIES[@]}" | awk -v abi="$ABI" 'tolower($0) ~ ("(^|/)bin/" tolower(abi) "/libnode\\.so$") && !seen {print; seen=1}')"

            if [[ -z "$ENTRY" ]]; then
              echo "ERROR: ${ABI}/libnode.so was not found."
              exit 1
            fi

            LIB_DIR="app/src/main/jniLibs/$ABI"
            mkdir -p "$LIB_DIR"
            unzip -p "$ZIP_FILE" "$ENTRY" > "$LIB_DIR/libnode.so"
          done
          echo "Node.js Mobile ARM libraries validated."

      - name: Grant execute permission for Gradle wrapper
        id: gradle_wrapper
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          chmod +x gradlew
          echo "Gradle wrapper is executable."

      - name: Build Release APKs
        id: build
        if: >-
          steps.java.outcome == 'success' &&
          steps.android_sdk.outcome == 'success' &&
          steps.signing.outcome == 'success' &&
          steps.nodejs_download.outcome == 'success' &&
          steps.gradle_wrapper.outcome == 'success'
        continue-on-error: true
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Build.log" "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail
          ./gradlew clean :app:assembleRelease --stacktrace --refresh-dependencies
          
          OUTPUT_DIR="app/build/outputs/apk/release"
          echo "Generated APK files:"
          find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f (%s bytes)\n'

      - name: Sign APKs, verify ABIs, and create download ZIPs
        id: verify
        if: steps.build.outcome == 'success' && steps.signing.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/Full-Actions.log") 2>&1
          set -Eeuo pipefail

          OUTPUT_DIR="app/build/outputs/apk/release"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          SIGN_DIR="$RUNNER_TEMP/rexaps-signed"

          mkdir -p "$DIST_DIR" "$SIGN_DIR"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          
          STORE_PASS_FILE="$RUNNER_TEMP/rexaps-store-pass"
          KEY_PASS_FILE="$RUNNER_TEMP/rexaps-key-pass"
          printf '%s' "$RELEASE_STORE_PASSWORD" > "$STORE_PASS_FILE"
          printf '%s' "$RELEASE_KEY_PASSWORD" > "$KEY_PASS_FILE"
          chmod 600 "$STORE_PASS_FILE" "$KEY_PASS_FILE"
          trap 'rm -f "$STORE_PASS_FILE" "$KEY_PASS_FILE"' EXIT

          sign_one() {
            local label="$1"
            local unsigned="$2"
            local signed="$3"
            local aligned="${unsigned%.apk}-aligned.apk"

            if [[ ! -s "$unsigned" ]]; then
              echo "ERROR: Expected APK missing: $unsigned"
              return 1
            fi

            # Menjalankan Zipalign sebelum Signing (Wajib)
            "$ZIPALIGN" -p -f 4 "$unsigned" "$aligned"

            "$APKSIGNER" sign \
              --ks "$RELEASE_STORE_FILE" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass "file:$STORE_PASS_FILE" \
              --key-pass "file:$KEY_PASS_FILE" \
              --out "$signed" \
              "$aligned"

            "$APKSIGNER" verify --verbose --print-certs "$signed"
            echo "Signed and verified: $label"
          }

          ARM64_APK="$SIGN_DIR/RexAps-arm64-v8a.apk"
          ARM32_APK="$SIGN_DIR/RexAps-armeabi-v7a.apk"
          UNIVERSAL_APK="$SIGN_DIR/RexAps-Universal.apk"

          # CATATAN: Pastikan build.gradle Anda diatur untuk menghasilkan 3 output APK ini.
          # Jika tidak, ganti nama file unsigned di bawah ini menjadi output Gradle yang Anda miliki (contoh: app-release-unsigned.apk)
          sign_one arm64-v8a "$OUTPUT_DIR/app-arm64-v8a-release-unsigned.apk" "$ARM64_APK"
          sign_one armeabi-v7a "$OUTPUT_DIR/app-armeabi-v7a-release-unsigned.apk" "$ARM32_APK"
          sign_one Universal "$OUTPUT_DIR/app-universal-release-unsigned.apk" "$UNIVERSAL_APK"

          create_bundle() {
            local bundle_name="$1"
            local apk_path="$2"
            local expected_csv="$3"
            local bundle_dir="$RUNNER_TEMP/$bundle_name"
            local -a expected_abis
            IFS=',' read -r -a expected_abis <<< "$expected_csv"
            mkdir -p "$bundle_dir"

            for ABI in "${expected_abis[@]}"; do
              # Pengecekan file diubah agar hanya mewajibkan libnode.so, menghapus libmozglue dan libxul
              if ! unzip -Z1 "$apk_path" | grep -Fxq "lib/$ABI/libnode.so"; then
                echo "ERROR: $bundle_name missing lib/$ABI/libnode.so"
                exit 1
              fi
            done

            cp "$apk_path" "$bundle_dir/$bundle_name.apk"
            (
              cd "$bundle_dir"
              zip -q -r "$DIST_DIR/$bundle_name.zip" .
            )
          }

          create_bundle RexAps-arm64-v8a "$ARM64_APK" arm64-v8a
          create_bundle RexAps-armeabi-v7a "$ARM32_APK" armeabi-v7a
          create_bundle RexAps-Universal "$UNIVERSAL_APK" arm64-v8a,armeabi-v7a

      - name: Upload Artifacts
        id: diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          # Proses Upload Diagnostik disederhanakan...
